<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="auto" style="background:#0f172a; border-radius:12px; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;">
  <!-- Header Banner -->
  <rect x="0" y="0" width="800" height="60" fill="#1e293b" />
  <text x="30" y="38" fill="#94a3b8" font-size="14" font-weight="600" letter-spacing="1">MAJOR SEC FILINGS COMPARISON MATRIX</text>
  <rect x="520" y="15" width="250" height="30" rx="6" fill="#8b5cf6" />
  <text x="645" y="35" fill="#ffffff" font-size="13" font-weight="700" text-anchor="middle">https://edgarscout.com/</text>

  <!-- Table Header -->
  <rect x="40" y="90" width="720" height="40" rx="6" fill="#334155" />
  <text x="60" y="115" fill="#f8fafc" font-size="13" font-weight="700">Form</text>
  <text x="160" y="115" fill="#f8fafc" font-size="13" font-weight="700">Purpose</text>
  <text x="380" y="115" fill="#f8fafc" font-size="13" font-weight="700">Filing Deadline</text>
  <text x="580" y="115" fill="#f8fafc" font-size="13" font-weight="700">Audit Status</text>

  <!-- Row 1: 10-K -->
  <rect x="40" y="135" width="720" height="40" fill="#1e293b" />
  <text x="60" y="160" fill="#38bdf8" font-size="13" font-weight="700">10-K</text>
  <text x="160" y="160" fill="#cbd5e1" font-size="13">Comprehensive Annual Report</text>
  <text x="380" y="160" fill="#94a3b8" font-size="13">60–90 days fiscal year-end</text>
  <text x="580" y="160" fill="#10b981" font-size="13">Audited Financials</text>

  <!-- Row 2: 10-Q -->
  <rect x="40" y="180" width="720" height="40" fill="#0f172a" />
  <text x="60" y="205" fill="#38bdf8" font-size="13" font-weight="700">10-Q</text>
  <text x="160" y="205" fill="#cbd5e1" font-size="13">Quarterly Financial Progress</text>
  <text x="380" y="205" fill="#94a3b8" font-size="13">40–45 days quarter-end</text>
  <text x="580" y="205" fill="#f59e0b" font-size="13">Reviewed (Unaudited)</text>

  <!-- Row 3: 8-K -->
  <rect x="40" y="225" width="720" height="40" fill="#1e293b" />
  <text x="60" y="250" fill="#38bdf8" font-size="13" font-weight="700">8-K</text>
  <text x="160" y="250" fill="#cbd5e1" font-size="13">Unscheduled Material Events</text>
  <text x="380" y="250" fill="#94a3b8" font-size="13">Within 4 business days</text>
  <text x="580" y="250" fill="#94a3b8" font-size="13">Event-dependent</text>

  <!-- Row 4: Form 4 -->
  <rect x="40" y="270" width="720" height="40" fill="#0f172a" />
  <text x="60" y="295" fill="#38bdf8" font-size="13" font-weight="700">Form 4</text>
  <text x="160" y="295" fill="#cbd5e1" font-size="13">Insider Equity Transactions</text>
  <text x="380" y="295" fill="#94a3b8" font-size="13">Within 2 business days</text>
  <text x="580" y="295" fill="#94a3b8" font-size="13">Self-reported / SEC</text>

  <!-- Row 5: 13F -->
  <rect x="40" y="315" width="720" height="40" fill="#1e293b" />
  <text x="60" y="340" fill="#38bdf8" font-size="13" font-weight="700">13F</text>
  <text x="160" y="340" fill="#cbd5e1" font-size="13">Institutional Manager Holdings</text>
  <text x="380" y="340" fill="#94a3b8" font-size="13">Within 45 days calendar qtr</text>
  <text x="580" y="340" fill="#94a3b8" font-size="13">Quarterly snapshot</text>

  <!-- Footer Watermark Bar -->
  <rect x="40" y="380" width="720" height="40" rx="8" fill="#1e293b" />
  <text x="400" y="405" fill="#8b5cf6" font-size="13" font-weight="600" text-anchor="middle">SEC Filing Deadlines &amp; Form Guide • https://edgarscout.com/</text>
